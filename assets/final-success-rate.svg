<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">不同位置观测噪声下的终态成功率</title>
  <desc id="desc">MuJoCo FetchPickAndPlace-v4 仿真结果，每组条件使用 30 个配对环境随机种子。20 mm 噪声下，EMA 终态成功率为 76.7%，未滤波策略为 33.3%；但在 5 mm 和 10 mm 条件下，EMA 表现更差。</desc>
  <rect width="1200" height="650" rx="24" fill="#f4f7fb"/>
  <text x="56" y="62" fill="#142033" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">位置观测噪声下的终态成功率</text>
  <text x="56" y="96" fill="#536278" font-family="Inter,Arial,sans-serif" font-size="17">FetchPickAndPlace-v4 · SAC+HER 预训练模型 · 每组条件 30 个配对环境随机种子</text>
  <rect x="56" y="122" width="1088" height="92" rx="16" fill="#10233f"/>
  <text x="84" y="158" fill="#b9c9dc" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">20 mm 位置噪声 · 终态成功率</text>
  <text x="84" y="192" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">33.3%</text>
  <text x="205" y="192" fill="#a7b7ca" font-family="Inter,Arial,sans-serif" font-size="18">→</text>
  <text x="242" y="192" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">76.7%</text>
  <rect x="890" y="143" width="220" height="50" rx="25" fill="#174e47"/>
  <text x="1000" y="175" text-anchor="middle" fill="#baf4df" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">+43.3 个百分点</text>
  <rect x="56" y="238" width="1088" height="340" rx="18" fill="#ffffff" stroke="#dbe3ed"/>
  <text x="88" y="278" fill="#1c2b41" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">终态成功率</text>
  <text x="88" y="302" fill="#65758b" font-family="Inter,Arial,sans-serif" font-size="13">回合结束时仍满足任务成功条件</text>
  <line x1="160" y1="338" x2="160" y2="500" stroke="#9aa8b9" stroke-width="1.5"/>
  <line x1="160" y1="500" x2="1055" y2="500" stroke="#9aa8b9" stroke-width="1.5"/>
  <g fill="#718096" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="end">
    <text x="145" y="505">0%</text><text x="145" y="465">25%</text><text x="145" y="424">50%</text><text x="145" y="384">75%</text><text x="145" y="343">100%</text>
  </g>
  <g stroke="#e6ebf2" stroke-width="1">
    <line x1="160" y1="460" x2="1055" y2="460"/><line x1="160" y1="419" x2="1055" y2="419"/><line x1="160" y1="379" x2="1055" y2="379"/><line x1="160" y1="338" x2="1055" y2="338"/>
  </g>
  <g fill="#536278" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">
    <text x="340" y="530">5 mm</text><text x="610" y="530">10 mm</text><text x="880" y="530">20 mm</text>
  </g>
  <text x="607" y="559" fill="#718096" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">高斯位置观测噪声标准差 σ</text>
  <polyline points="340,338 610,349 880,446" fill="none" stroke="#2463a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="340,365 610,376 880,376" fill="none" stroke="#d97732" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#2463a6" stroke-width="2.2" fill="#2463a6">
    <line x1="340" y1="338" x2="340" y2="356"/><line x1="332" y1="338" x2="348" y2="338"/><line x1="332" y1="356" x2="348" y2="356"/>
    <line x1="610" y1="341" x2="610" y2="372"/><line x1="602" y1="341" x2="618" y2="341"/><line x1="602" y1="372" x2="618" y2="372"/>
    <line x1="880" y1="417" x2="880" y2="469"/><line x1="872" y1="417" x2="888" y2="417"/><line x1="872" y1="469" x2="888" y2="469"/>
    <circle cx="340" cy="338" r="7"/><circle cx="610" cy="349" r="7"/><circle cx="880" cy="446" r="7"/>
  </g>
  <g stroke="#d97732" stroke-width="2.2" fill="#d97732">
    <line x1="340" y1="349" x2="340" y2="393"/><line x1="332" y1="349" x2="348" y2="349"/><line x1="332" y1="393" x2="348" y2="393"/>
    <line x1="610" y1="357" x2="610" y2="405"/><line x1="602" y1="357" x2="618" y2="357"/><line x1="602" y1="405" x2="618" y2="405"/>
    <line x1="880" y1="357" x2="880" y2="405"/><line x1="872" y1="357" x2="888" y2="357"/><line x1="872" y1="405" x2="888" y2="405"/>
    <circle cx="340" cy="365" r="7"/><circle cx="610" cy="376" r="7"/><circle cx="880" cy="376" r="7"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">
    <text x="340" y="326" fill="#2463a6" text-anchor="middle">100.0%</text>
    <text x="610" y="337" fill="#2463a6" text-anchor="middle">93.3%</text>
    <text x="880" y="433" fill="#2463a6" text-anchor="middle">33.3%</text>
    <text x="340" y="389" fill="#b65d20" text-anchor="middle">83.3%</text>
    <text x="610" y="400" fill="#b65d20" text-anchor="middle">76.7%</text>
    <text x="880" y="400" fill="#b65d20" text-anchor="middle">76.7%</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#3d4d63">
    <line x1="870" y1="277" x2="910" y2="277" stroke="#2463a6" stroke-width="4"/><circle cx="890" cy="277" r="5" fill="#2463a6"/><text x="920" y="282">未滤波策略</text>
    <line x1="1020" y1="277" x2="1060" y2="277" stroke="#d97732" stroke-width="4"/><circle cx="1040" cy="277" r="5" fill="#d97732"/><text x="1070" y="282">EMA 滤波策略</text>
  </g>
  <text x="56" y="615" fill="#65758b" font-family="Inter,Arial,sans-serif" font-size="13">误差线：95% Wilson 置信区间。仅使用一个固定的第三方预训练模型；结果仅来自仿真。EMA 并非在所有条件下都更好。</text>
</svg>