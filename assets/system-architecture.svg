<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
<title id="title">MuJoCo 机械臂鲁棒性评估项目工程架构图</title>
<desc id="desc">展示实验配置、MuJoCo 环境、状态观测、三种观测条件、固定 SAC 加 HER 策略、动作执行、闭环反馈、轨迹诊断与可复现证据输出之间的关系。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1722"/><stop offset="1" stop-color="#101f2c"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172d3d"/><stop offset="1" stop-color="#112331"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64d9bc"/><stop offset="1" stop-color="#a0f0d7"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#65a7ef"/><stop offset="1" stop-color="#a5caff"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6b45e"/><stop offset="1" stop-color="#f8d58f"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02080d" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#80dcca" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#78aef0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .title{font-size:42px;font-weight:800;fill:#f0f7f7;letter-spacing:1px}
    .subtitle{font-size:20px;fill:#a8bdc8}
    .section{font-size:27px;font-weight:800;fill:#f0f7f7}
    .body{font-size:18px;fill:#c3d2da}
    .small{font-size:15px;fill:#9eb3be}
    .label{font-size:13px;font-weight:800;letter-spacing:1px;fill:#071a20}
    .file{font-size:15px;fill:#8fe6d0;font-family:Consolas,"Courier New",monospace}
    .io{font-size:15px;fill:#d1dee4}
    .branchTitle{font-size:22px;font-weight:800;fill:#f2f7f8}
    .branchBody{font-size:16px;fill:#c1d1d9}
    .foot{font-size:16px;fill:#c3d2da}
    .muted{fill:#91a9b5}
  </style>
</defs>
<rect width="1600" height="2000" fill="url(#bg)"/>
<circle cx="1400" cy="90" r="210" fill="#173d45" opacity=".16"/>
<circle cx="120" cy="1750" r="220" fill="#173d45" opacity=".12"/>
<text x="800" y="78" text-anchor="middle" class="title">MuJoCo 机械臂鲁棒性评估｜工程架构</text>
<text x="800" y="119" text-anchor="middle" class="subtitle">固定预训练策略 · 可控观测扰动 · 闭环执行 · 逐步诊断与可复现交付</text>
<rect x="575" y="142" width="450" height="34" rx="17" fill="#183c39" stroke="#3d8876"/>
<text x="800" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#a4f1d8">工程实现与实验评估｜非真实机械臂部署</text>

<!-- Card 1 -->
<g filter="url(#shadow)">
 <rect x="180" y="205" width="1240" height="120" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="205" width="12" height="120" rx="6" fill="url(#mint)"/>
 <circle cx="238" cy="265" r="28" fill="#204b4a" stroke="#64d9bc"/>
 <path d="M225 265h26M238 252v26M229 256l18 18M247 256l-18 18" stroke="#9cf0d8" stroke-width="2.5" stroke-linecap="round"/>
 <text x="286" y="250" class="section">实验配置与模型管理</text>
 <text x="286" y="281" class="body">固定依赖、配置随机种子与实验参数；下载固定版本权重并校验 SHA-256。</text>
 <text x="286" y="306" class="file">requirements.txt · RUN_WINDOWS.ps1 · download_checkpoint.py</text>
 <rect x="1050" y="226" width="330" height="78" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="252" class="io">输入：Python 版本、依赖、参数</text>
 <text x="1070" y="280" class="io">输出：运行环境、模型来源与校验记录</text>
</g>
<path d="M800 326 V350" stroke="#80dcca" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Card 2 -->
<g filter="url(#shadow)">
 <rect x="180" y="360" width="1240" height="120" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="360" width="12" height="120" rx="6" fill="url(#blue)"/>
 <circle cx="238" cy="420" r="28" fill="#1e3d5b" stroke="#78aef0"/>
 <path d="M224 428l14-25 14 25M229 419h18M238 403v30" fill="none" stroke="#b5d6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="286" y="405" class="section">MuJoCo 仿真环境</text>
 <text x="286" y="436" class="body">运行 FetchPickAndPlace-v4 物理仿真；每回合重置环境并推进真实物理状态。</text>
 <text x="286" y="461" class="file">evaluate_robustness.py · diagnose_trajectories.py · record_demo.py</text>
 <rect x="1050" y="381" width="330" height="78" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="407" class="io">输入：环境随机种子、action</text>
 <text x="1070" y="435" class="io">输出：真实状态、reward、info</text>
</g>
<path d="M800 481 V505" stroke="#80dcca" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Card 3 -->
<g filter="url(#shadow)">
 <rect x="180" y="515" width="1240" height="120" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="515" width="12" height="120" rx="6" fill="#61c6d2"/>
 <circle cx="238" cy="575" r="28" fill="#19434b" stroke="#61c6d2"/>
 <circle cx="229" cy="569" r="6" fill="none" stroke="#b4f3f4" stroke-width="2"/><circle cx="247" cy="569" r="6" fill="none" stroke="#b4f3f4" stroke-width="2"/><path d="M219 588q10-14 20 0q10-14 20 0" fill="none" stroke="#b4f3f4" stroke-width="2"/>
 <text x="286" y="560" class="section">状态观测与目标字段</text>
 <text x="286" y="591" class="body">提取夹爪、物块与相对位置；同步维护 achieved_goal 与 desired_goal 的语义一致性。</text>
 <text x="286" y="616" class="file">evaluate_robustness.py</text>
 <rect x="1050" y="536" width="330" height="78" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="562" class="io">输入：环境 observation</text>
 <text x="1070" y="590" class="io">输出：策略观测字典与目标字段</text>
</g>
<path d="M800 636 V660" stroke="#80dcca" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Card 4 -->
<g filter="url(#shadow)">
 <rect x="180" y="670" width="1240" height="120" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="670" width="12" height="120" rx="6" fill="url(#gold)"/>
 <circle cx="238" cy="730" r="28" fill="#4b3c25" stroke="#e6b45e"/>
 <path d="M221 730h10l6-12 8 24 6-12h8" fill="none" stroke="#ffdda0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="286" y="715" class="section">观测扰动处理与实验条件分流</text>
 <text x="286" y="746" class="body">仅对策略接收的 XYZ 位置观测施加干预；不直接改写 MuJoCo 内部物理状态。</text>
 <text x="286" y="771" class="file">evaluate_robustness.py · diagnose_trajectories.py</text>
 <rect x="1050" y="691" width="330" height="78" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="717" class="io">输入：原始位置观测</text>
 <text x="1070" y="745" class="io">输出：三种可对照的策略输入</text>
</g>

<!-- Branches -->
<path d="M800 791 V817 H380 V842 M800 817 V842 M800 817 H1220 V842" fill="none" stroke="#80dcca" stroke-width="2.5"/>
<path d="M380 825 V842 M800 825 V842 M1220 825 V842" stroke="#80dcca" stroke-width="2.5" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="180" y="850" width="400" height="150" rx="18" fill="#172b37" stroke="#70a9df" stroke-width="2"/>
 <rect x="180" y="850" width="400" height="8" rx="4" fill="url(#blue)"/>
 <text x="210" y="890" class="branchTitle">A｜无噪声基线</text>
 <text x="210" y="924" font-size="20" font-weight="800" fill="#a9cefa">σ = 0 mm</text>
 <text x="210" y="956" class="branchBody">原始位置观测直接输入固定策略</text>
 <text x="210" y="982" class="small">对照：基准任务表现</text>
</g>
<g filter="url(#shadow)">
 <rect x="600" y="850" width="400" height="150" rx="18" fill="#30291d" stroke="#d6a34e" stroke-width="2"/>
 <rect x="600" y="850" width="400" height="8" rx="4" fill="url(#gold)"/>
 <text x="630" y="890" class="branchTitle">B｜高斯噪声未滤波</text>
 <text x="630" y="924" font-size="20" font-weight="800" fill="#f2ce8a">σ = 5 / 10 / 20 mm</text>
 <text x="630" y="956" class="branchBody">夹爪与物块 XYZ 注入独立高斯噪声</text>
 <text x="630" y="982" class="small">对照：噪声影响</text>
</g>
<g filter="url(#shadow)">
 <rect x="1020" y="850" width="400" height="150" rx="18" fill="#1e303b" stroke="#65cbb4" stroke-width="2"/>
 <rect x="1020" y="850" width="400" height="8" rx="4" fill="url(#mint)"/>
 <text x="1050" y="890" class="branchTitle">C｜高斯噪声 + EMA</text>
 <text x="1050" y="924" font-size="20" font-weight="800" fill="#9ce9d3">σ = 5 / 10 / 20 mm · α = 0.35</text>
 <text x="1050" y="956" class="branchBody">噪声观测先滤波，再输入同一策略</text>
 <text x="1050" y="982" class="small">对照：降噪与响应滞后权衡</text>
</g>
<path d="M380 1001 V1022 H800 M800 1001 V1044 M1220 1001 V1022 H800" fill="none" stroke="#80dcca" stroke-width="2.5"/>
<path d="M800 1022 V1042" stroke="#80dcca" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Policy -->
<g filter="url(#shadow)">
 <rect x="180" y="1050" width="1240" height="120" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="1050" width="12" height="120" rx="6" fill="#9a8de2"/>
 <circle cx="238" cy="1110" r="28" fill="#352f59" stroke="#9a8de2"/>
 <path d="M224 1110q14-20 28 0q-14 20-28 0M238 1096v28M224 1110h28" fill="none" stroke="#d3cbff" stroke-width="2"/>
 <text x="286" y="1095" class="section">固定 SAC + HER 预训练策略</text>
 <text x="286" y="1126" class="body">三种实验条件共用同一组模型权重，采用确定性动作预测；本项目不重新训练策略。</text>
 <text x="286" y="1151" class="file">上游模型：hhmm1122/fetch-pickandplace-sac-her</text>
 <rect x="1050" y="1071" width="330" height="78" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="1097" class="io">输入：策略观测字典</text>
 <text x="1070" y="1125" class="io">输出：deterministic action</text>
</g>
<path d="M800 1171 V1195" stroke="#80dcca" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Action -->
<g filter="url(#shadow)">
 <rect x="180" y="1205" width="1240" height="120" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="1205" width="12" height="120" rx="6" fill="url(#mint)"/>
 <circle cx="238" cy="1265" r="28" fill="#204b4a" stroke="#64d9bc"/>
 <path d="M226 1252l25 13-25 13z" fill="none" stroke="#a3f1dc" stroke-width="2.5" stroke-linejoin="round"/>
 <text x="286" y="1250" class="section">动作执行</text>
 <text x="286" y="1281" class="body">将策略输出的动作送入仿真环境，推进一个控制步并触发下一次状态更新。</text>
 <text x="286" y="1306" class="file">evaluate_robustness.py · record_demo.py</text>
 <rect x="1050" y="1226" width="330" height="78" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="1252" class="io">输入：action</text>
 <text x="1070" y="1280" class="io">输出：next state transition</text>
</g>
<path d="M800 1326 V1350" stroke="#80dcca" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Feedback -->
<g filter="url(#shadow)">
 <rect x="180" y="1360" width="1240" height="120" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="1360" width="12" height="120" rx="6" fill="url(#blue)"/>
 <circle cx="238" cy="1420" r="28" fill="#1e3d5b" stroke="#78aef0"/>
 <path d="M222 1420a16 16 0 0 1 27-11M249 1409v10h-10M254 1420a16 16 0 0 1-27 11M227 1431v-10h10" fill="none" stroke="#b5d6ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="286" y="1405" class="section">MuJoCo 反馈与下一步观测</text>
 <text x="286" y="1436" class="body">环境返回下一步 observation、reward、done 与任务成功信号，进入下一控制循环。</text>
 <text x="286" y="1461" class="file">evaluate_robustness.py · diagnose_trajectories.py</text>
 <rect x="1050" y="1381" width="330" height="78" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="1407" class="io">输出：next observation、reward</text>
 <text x="1070" y="1435" class="io">done、info["is_success"]</text>
</g>
<path d="M1422 1420 H1480 V420 H1422" fill="none" stroke="#78aef0" stroke-width="3" marker-end="url(#arrowBlue)"/>
<rect x="1450" y="810" width="42" height="230" rx="20" fill="#17334a" stroke="#4775a0"/>
<text x="1477" y="925" text-anchor="middle" font-size="17" font-weight="800" fill="#b7d7ff" transform="rotate(-90 1477 925)">闭环反馈 · 下一控制步</text>
<path d="M800 1481 V1505" stroke="#80dcca" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Diagnostics -->
<g filter="url(#shadow)">
 <rect x="180" y="1515" width="1240" height="145" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="1515" width="12" height="145" rx="6" fill="url(#gold)"/>
 <circle cx="238" cy="1587" r="28" fill="#4b3c25" stroke="#e6b45e"/>
 <path d="M222 1598v-15h8v15M234 1598v-27h8v27M246 1598v-20h8v20" fill="none" stroke="#ffdda0" stroke-width="3" stroke-linecap="round"/>
 <text x="286" y="1560" class="section">评估与轨迹诊断</text>
 <text x="286" y="1591" class="body">成功率、首次成功、回报、位置 RMSE、方向滞后投影、动作差异与物块—目标距离。</text>
 <text x="286" y="1622" class="file">evaluate_robustness.py · diagnose_trajectories.py · analyze_paired.py · plot_results.py</text>
 <rect x="1050" y="1536" width="330" height="103" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="1563" class="io">输入：逐步状态、动作、回合结果</text>
 <text x="1070" y="1591" class="io">输出：汇总统计、诊断曲线</text>
 <text x="1070" y="1619" class="io">配对分析与失败案例证据</text>
</g>
<path d="M800 1661 V1685" stroke="#80dcca" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Outputs -->
<g filter="url(#shadow)">
 <rect x="180" y="1695" width="1240" height="130" rx="20" fill="url(#card)" stroke="#3b5c6c" stroke-width="2"/>
 <rect x="180" y="1695" width="12" height="130" rx="6" fill="url(#mint)"/>
 <circle cx="238" cy="1760" r="28" fill="#204b4a" stroke="#64d9bc"/>
 <path d="M227 1745h16l8 8v23h-24zM243 1745v9h8M232 1762h14M232 1770h14" fill="none" stroke="#a3f1dc" stroke-width="2"/>
 <text x="286" y="1745" class="section">可复现证据与作品集输出</text>
 <text x="286" y="1776" class="body">保留逐回合与逐步记录、统计汇总、诊断图表、仿真演示和项目报告。</text>
 <text x="286" y="1806" class="file">evidence/*.csv(.gz) · evidence/*.json · evidence/trajectory-diagnostics/ · assets/demo.gif · index.html</text>
 <rect x="1050" y="1716" width="330" height="88" rx="12" fill="#0d1c27" stroke="#365260"/>
 <text x="1070" y="1742" class="io">输出：summary.csv / summary.json</text>
 <text x="1070" y="1770" class="io">diagnostics_report.md / 图表 / GIF</text>
</g>

<rect x="180" y="1860" width="1240" height="85" rx="18" fill="#102a34" stroke="#3a6c6b" stroke-width="1.5"/>
<text x="215" y="1894" font-size="17" font-weight="800" fill="#9ce9d3">项目边界</text>
<text x="215" y="1921" class="foot">单个第三方预训练策略 · 位置观测噪声仿真实验 · 不重新训练策略 · 不代表真实机械臂部署</text>
<text x="800" y="1973" text-anchor="middle" font-size="14" fill="#78929e">工程架构说明：展示实际代码模块、实验条件分支与数据流；箭头表示控制与数据关系。</text>
</svg>