name: Portfolio CI

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependency
        run: python -m pip install "numpy==2.3.5"
      - name: Compile project modules
        run: python -m py_compile evaluate_robustness.py analyze_paired.py plot_results.py record_demo.py download_checkpoint.py
      - name: Run unit and mock-environment tests
        run: python -m unittest discover -s tests -v
