name: 部署公开作品集网站

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "evidence/trajectory-diagnostics/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并发布作品集网页
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 获取公开作品集
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 组装静态网站
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/demo.gif _site/assets/demo.gif
          cp assets/final-success-rate.svg _site/assets/final-success-rate.svg
          cp assets/system-architecture.png _site/assets/system-architecture.png
          cp assets/system-architecture.svg _site/assets/system-architecture.svg
          cp evidence/trajectory-diagnostics/position_error_comparison.png _site/assets/position_error_comparison.png
          cp evidence/trajectory-diagnostics/goal_distance_20mm.png _site/assets/goal_distance_20mm.png

      - name: 上传静态网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
