name: Reproduce 30-seed MuJoCo evaluation

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episodes per condition (30 reproduces the published evaluation)"
        required: true
        default: "30"
        type: string
      seed_start:
        description: "First environment seed (10000 reproduces the published evaluation)"
        required: true
        default: "10000"
        type: string

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Download the pinned third-party checkpoint and verify SHA-256
        run: python download_checkpoint.py --output-dir upstream-model
      - name: Run the requested matched-seed evaluation
        run: |
          python evaluate_robustness.py \
            --model upstream-model/best_model.zip --hf-compatible \
            --episodes "${{ inputs.episodes }}" \
            --seed-start "${{ inputs.seed_start }}" \
            --output results/public-evaluation
      - name: Plot measured results
        run: |
          python plot_results.py \
            --summary results/public-evaluation/summary.json \
            --output results/public-evaluation/success_rate_comparison.png
      - name: Run paired-seed analysis
        run: |
          python analyze_paired.py \
            --episodes results/public-evaluation/episodes.csv \
            --output results/public-evaluation/paired_analysis.json
      - name: Upload raw data, summary, plots and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-public-evaluation-evidence
          path: |
            results/public-evaluation/
            upstream-model/model_provenance.json
          retention-days: 30
