name: 生成 MuJoCo 机械臂仿真演示

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo.yml"
      - "record_demo.py"
      - "download_checkpoint.py"
      - "evaluate_robustness.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 OSMesa 离屏渲染组件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libosmesa6 libgl1-mesa-dri libgl1
      - name: 安装 CPU 版 PyTorch 与项目依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: 下载固定版本的第三方模型并核验 SHA-256
        run: python download_checkpoint.py --output-dir upstream-model
      - name: 在独立渲染环境中录制指定随机种子对照演示
        run: |
          python record_demo.py \
            --model upstream-model/best_model.zip \
            --seed 10001 --noise-sigma 0.02 --expect-contrast \
            --output assets/demo.gif
      - name: 将模型来源记录保存到演示文件旁
        run: cp upstream-model/model_provenance.json assets/model_provenance.json
      - name: 上传生成的演示文件作为工作流构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 机械臂指定随机种子仿真演示
          path: |
            assets/demo.gif
            assets/demo.json
            assets/model_provenance.json
          retention-days: 30
      - name: 将核验通过的演示文件提交到公开作品集
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/demo.gif assets/demo.json assets/model_provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible MuJoCo demo [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
