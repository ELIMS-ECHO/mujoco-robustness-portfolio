name: Generate MuJoCo demonstration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo.yml"
      - "record_demo.py"
      - "download_checkpoint.py"
      - "evaluate_robustness.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OSMesa renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libosmesa6 libgl1-mesa-dri libgl1
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Download the pinned third-party checkpoint and verify SHA-256
        run: python download_checkpoint.py --output-dir upstream-model
      - name: Record the selected-seed comparison in an isolated render environment
        run: |
          python record_demo.py \
            --model upstream-model/best_model.zip \
            --seed 10001 --noise-sigma 0.02 --expect-contrast \
            --output assets/demo.gif
      - name: Preserve model provenance beside the demo
        run: cp upstream-model/model_provenance.json assets/model_provenance.json
      - name: Upload generated demo as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-selected-seed-demo
          path: |
            assets/demo.gif
            assets/demo.json
            assets/model_provenance.json
          retention-days: 30
      - name: Commit the verified demo to the public portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/demo.gif assets/demo.json assets/model_provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible MuJoCo demo [skip ci]"
            git push
          fi
